services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: timescale-db
    environment:
      POSTGRES_DB: timescale_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: